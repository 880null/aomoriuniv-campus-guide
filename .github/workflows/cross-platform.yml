name: Cross-platform verification

on:
  workflow_dispatch:
  push:
    paths:
      - backend/**
      - frontend/**
      - data/**
      - firmware/**
      - scripts/**
      - tests/**
      - start.command
      - start.bat
      - requirements.txt
      - .github/workflows/cross-platform.yml

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.10のmacOS配布はIntel用。ARM版は3.13と手元のMacでも検証する。
          - os: macos-15-intel
            python: '3.10'
          - os: macos-latest
            python: '3.13'
          - os: windows-latest
            python: '3.10'
          - os: windows-latest
            python: '3.13'
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Python, firmware logic and simulated serial tests
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript and official data
        run: |
          node --check frontend/static/app.js
          python scripts/build_room_catalog.py --check
      - name: DOM integration tests
        env:
          CAMPUS_TEST_PYTHON: python
        run: |
          npm --prefix tests ci
          npm --prefix tests test
      - name: Install browser test tools
        if: matrix.python == '3.13'
        run: python -m pip install -r tests/requirements-browser.txt
      - name: Install macOS browser engines
        if: runner.os == 'macOS' && matrix.python == '3.13'
        run: python -m playwright install chromium webkit
      - name: Install Windows browser engine
        if: runner.os == 'Windows' && matrix.python == '3.13'
        run: python -m playwright install chromium
      - name: Launch-file and HTTP verification (Python 3.10)
        if: matrix.python == '3.10'
        run: python scripts/verify_runtime.py --report validation-results/runtime.json
      - name: macOS launch-file and Chromium / WebKit verification
        if: runner.os == 'macOS' && matrix.python == '3.13'
        run: python scripts/verify_runtime.py --browser chromium --browser webkit --report validation-results/runtime.json
      - name: Windows launch-file and Chromium / Edge verification
        if: runner.os == 'Windows' && matrix.python == '3.13'
        run: python scripts/verify_runtime.py --browser chromium --browser msedge --report validation-results/runtime.json
      - name: Compile Uno firmware
        if: matrix.python == '3.13'
        run: |
          python -m pip install platformio==6.2.0
          pio run -d firmware
      - name: Save logs, browser screenshots and result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.os }}-python-${{ matrix.python }}
          path: validation-results/
          if-no-files-found: warn
          retention-days: 14
